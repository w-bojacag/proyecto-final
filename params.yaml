# Municipios modelados: cada uno tiene su propio clima, matriz y modelos (independientes entre sí).
# - nombre: valor de Municipio_ocurrencia en SIVIGILA
# - divipola: código DANE (MPIO_CDPMP) para el polígono de la cabecera urbana (MGN 2021)
municipios:
  cartagena:
    nombre: CARTAGENA
    divipola: "13001"
  magangue:
    nombre: MAGANGUE
    divipola: "13430"
  el_carmen_de_bolivar:
    nombre: EL CARMEN DE BOLIVAR
    divipola: "13244"
  turbaco:
    nombre: TURBACO
    divipola: "13836"
  santa_rosa_del_sur:
    nombre: SANTA ROSA DEL SUR
    divipola: "13688"

# Definición de brote (canal endémico móvil), compartida por todos los modelos.
# Brote en la semana s del año Y: casos > percentil de la semana s en los años Y-anos_ventana..Y-1.
target:
  anos_ventana: 5
  anos_minimos: 3   # años previos mínimos para calcular el umbral (antes no hay etiqueta)
  percentil: 0.75
  horizonte: 4

# Partición cronológica por años epidemiológicos (inclusive):
# entrenamiento <= train_end_year < validación <= val_end_year < prueba.
# Validación y prueba se evalúan con walk-forward anual: para predecir el año Y se entrena
# con todos los años anteriores a Y.
particion:
  train_end_year: 2019
  val_end_year: 2022

train:
  n_estimators: 250
  learning_rate: 0.005
  max_depth: 1
  min_child_weight: 15
  reg_alpha: 20.0
  reg_lambda: 20.0
  random_state: 42
  subsample: 0.6
  colsample_bytree: 0.4

logistica:
  C: 1.0   # inverso de la regularización L2
  variables:
    - ratio_casos_umbral_objetivo   # casos de la semana / umbral de brote de dentro de 4 semanas
    - ratio_roll4_umbral_objetivo   # media de las últimas 4 semanas / umbral de dentro de 4 semanas
    - exceso_actual                 # casos de la semana / umbral de brote de esta semana

evaluate:
  tamano_bloque: 8      # semanas consecutivas por bloque en el bootstrap
  repeticiones: 2000
  semilla: 42

lstm:
  window_size: 12
  max_epochs: 100
  patience: 10
  batch_size: 32
  lstm_units: 16
  dropout_rate: 0.5
  learning_rate: 0.001
  semillas: [42, 7, 2026]
  # true: 9 variables climáticas + 3 epidemiológicas por semana. Se elige con validación
  # (2020-2022), no con prueba: con clima 0.821, sin clima 0.803.
  incluir_clima: true

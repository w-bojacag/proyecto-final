train:
  n_estimators: 80
  learning_rate: 0.03
  max_depth: 2
  min_child_weight: 5
  reg_alpha: 2.0
  reg_lambda: 1.0
  random_state: 42
  subsample: 0.7
  colsample_bytree: 0.7
  # Partición cronológica por años epidemiológicos (inclusive):
  # entrenamiento <= train_end_year < validación <= val_end_year < prueba
  train_end_year: 2019
  val_end_year: 2022

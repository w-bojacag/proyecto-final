train:
  n_estimators: 250
  learning_rate: 0.005
  max_depth: 1
  min_child_weight: 15
  reg_alpha: 20.0
  reg_lambda: 20.0
  random_state: 42
  subsample: 0.6
  colsample_bytree: 0.4
  # Partición cronológica por años epidemiológicos (inclusive):
  # entrenamiento <= train_end_year < validación <= val_end_year < prueba
  train_end_year: 2019
  val_end_year: 2022

lstm:
  window_size: 12
  epochs: 100
  batch_size: 32
  lstm_units: 16
  dropout_rate: 0.5
  learning_rate: 0.001
  anos_ventana: 5
  train_end_year: 2019
  val_end_year: 2022



